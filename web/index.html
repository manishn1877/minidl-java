<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniDL handwriting</title>
<style>
:root{--paper:#eef1ee;--ink:#14213d;--red:#d7263d;--line:#c9d3d0;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--paper) linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 28px;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px}
@media(max-width:800px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font:700 26px/1.2 var(--mono)}
h1 small{display:block;font:400 13px var(--mono);opacity:.7;margin-top:4px}
.card{background:#fff;border:2px solid var(--ink);padding:12px;box-shadow:5px 5px 0 var(--ink)}
.stage{position:relative;line-height:0;border:1px solid var(--line);touch-action:none}
canvas#c{width:100%;height:auto;cursor:crosshair;background:#fff;display:block}
canvas#o{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{font:600 13px var(--mono);border:2px solid var(--ink);background:#fff;color:var(--ink);padding:6px 10px;cursor:pointer}
button:hover{background:var(--ink);color:#fff}
button.on{background:var(--ink);color:#fff}
label{font-size:13px}
#answer{font:700 54px/1 var(--mono);color:var(--red);min-height:56px;letter-spacing:.08em;word-break:break-all}
#meta{font:12px var(--mono);opacity:.75;min-height:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font:600 13px var(--mono);border:2px solid var(--ink);padding:2px 8px;cursor:pointer;background:#fff}
.chip.sel{border-color:var(--red);color:var(--red)}
.bar{display:grid;grid-template-columns:16px 1fr 46px;gap:6px;align-items:center;font:12px var(--mono);margin:2px 0}
.bar i{display:block;height:12px;background:var(--ink);width:0;transition:width .15s}
.bar.top i{background:var(--red)}
#view{width:112px;height:112px;image-rendering:pixelated;border:1px solid var(--ink);background:#fff}
#teach button{padding:4px 9px;min-width:34px}
h2{font:700 14px var(--mono);margin:14px 0 6px}
#msg{font:12px var(--mono);color:var(--red);min-height:18px;margin-top:8px}
.side{display:flex;flex-direction:column;gap:20px}
</style></head><body><main>
<h1>MiniDL handwriting<small id="info">loading model...</small></h1>

<section class="card">
  <div class="stage"><canvas id="c" width="720" height="320"></canvas><canvas id="o" width="720" height="320"></canvas></div>
  <div class="row">
    <button id="mSingle" class="on">one character</button><button id="mMulti">many (number / word)</button>
    <button id="clear">clear</button><button id="undo">undo</button>
    <label>pen <input id="brush" type="range" min="8" max="40" value="20"></label>
    <label><input id="tta" type="checkbox" checked> steadier (averages 5 nudged views)</label>
  </div>
  <div class="row">
    <button id="up">load a photo/scan</button><input id="file" type="file" accept="image/*" hidden>
    <button id="prac">train on my handwriting</button><button id="save">save tuned model</button><button id="reset">reset model</button>
  </div>
  <div id="msg"></div>
</section>

<section class="side">
  <div class="card">
    <div id="answer">-</div><div id="meta"></div>
    <div class="chips" id="chips"></div>
    <div id="bars"></div>
    <h2>what the model sees (28x28)</h2><canvas id="view" width="28" height="28"></canvas>
  </div>
  <div class="card" id="pracBox" hidden>
    <h2 style="margin-top:0">draw this, then press Enter</h2>
    <div id="target" style="font:700 64px/1 var(--mono);color:var(--red)">-</div>
    <div class="row"><button id="submit">submit (Enter)</button><button id="skip">skip</button></div>
    <div id="score" style="font:12px var(--mono);margin-top:8px"></div>
  </div>
  <div class="card" id="teachBox" hidden>
    <h2 style="margin-top:0">wrong? tell it what it really is</h2>
    <div class="row" id="teach" style="margin-top:0"></div>
    <div class="row" style="margin-top:6px;font-size:12px;opacity:.75">It takes a few small training steps on your drawing, right now, in this page's model.</div>
  </div>
</section>
</main>
<script>
const $=s=>document.querySelector(s), cv=$('#c'), ov=$('#o'), ctx=cv.getContext('2d',{willReadFrequently:true}), oc=ov.getContext('2d');
const W=cv.width, H=cv.height;
let abc='0123456789', prac=false, tgt='', pool=[], got=0, tried=0, mode='single', drawing=false, last=[], sel=0, text='', ms=0, timer=0, seq=0, undo=[];
const blank=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}; blank();
const say=t=>{$('#msg').textContent=t};
const later=t=>{clearTimeout(timer);timer=setTimeout(predict,t)};
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};

cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);undo.push(ctx.getImageData(0,0,W,H));if(undo.length>20)undo.shift();
  drawing=true;const[x,y]=pos(e);ctx.fillStyle=ctx.strokeStyle='#111';ctx.lineWidth=+$('#brush').value;ctx.lineCap=ctx.lineJoin='round';
  ctx.beginPath();ctx.arc(x,y,ctx.lineWidth/2,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x,y);later(500)});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y);later(300)});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(drawing){drawing=false;later(60)}}));

function getInk(){const d=ctx.getImageData(0,0,W,H).data,ink=new Uint8Array(W*H);let any=false;
  for(let i=0;i<ink.length;i++){const v=255-d[i*4];ink[i]=v;if(v>40)any=true}return any?ink:null}

async function predict(){
  const ink=getInk(), my=++seq;
  if(!ink){last=[];text='';render();return}
  try{
    const r=await fetch(`/api/predict?w=${W}&h=${H}&mode=${mode}&tta=${$('#tta').checked?1:0}`,{method:'POST',body:ink});
    const j=await r.json(); if(my!==seq)return; if(j.error){say(j.error);return}
    last=j.digits;text=j.text;ms=j.ms;sel=Math.min(sel,Math.max(0,last.length-1));render();
  }catch(e){say('server not reachable: '+e)}
}

function render(){
  $('#answer').textContent=text||'-';
  $('#meta').textContent=last.length?`${ms} ms · ${last.length} character${last.length>1?'s':''}`:'draw something';
  $('#chips').innerHTML='';
  if(mode==='multi')last.forEach((d,i)=>{const c=document.createElement('span');c.className='chip'+(i===sel?' sel':'');
    c.textContent=`${d.ch} ${Math.round(d.conf*100)}%`;c.onclick=()=>{sel=i;render()};$('#chips').append(c)});
  const d=last[sel], bars=$('#bars'); bars.innerHTML='';
  if(d)d.probs.map((p,i)=>[p,i]).sort((a,b)=>b[0]-a[0]).slice(0,6).forEach(([p,i])=>{const b=document.createElement('div');b.className='bar'+(i===d.label?' top':'');
    b.innerHTML=`<span>${abc[i]}</span><div><i style="width:${(p*100).toFixed(1)}%"></i></div><span>${(p*100).toFixed(1)}%</span>`;bars.append(b)});
  const v=$('#view').getContext('2d'), im=v.createImageData(28,28);
  for(let i=0;i<784;i++){const g=d?255-d.view[i]:255;im.data.set([g,g,g,255],i*4)}v.putImageData(im,0,0);
  oc.clearRect(0,0,W,H);oc.lineWidth=3;oc.font='700 26px ui-monospace,monospace';
  last.forEach((q,i)=>{oc.strokeStyle=oc.fillStyle=i===sel?'#d7263d':'rgba(215,38,61,.55)';oc.strokeRect(q.x-6,q.y-6,q.w+12,q.h+12);oc.fillText(q.ch,q.x-6,Math.max(24,q.y-12))});
  $('#teachBox').hidden=!(mode==='single'&&last.length&&!prac);
}

function setMode(m){mode=m;sel=0;$('#mSingle').classList.toggle('on',m==='single');$('#mMulti').classList.toggle('on',m==='multi');predict()}
$('#mSingle').onclick=()=>setMode('single');$('#mMulti').onclick=()=>setMode('multi');
$('#clear').onclick=()=>{undo.push(ctx.getImageData(0,0,W,H));blank();say('');predict()};
$('#undo').onclick=()=>{if(undo.length){ctx.putImageData(undo.pop(),0,0);predict()}};
$('#tta').onchange=predict;
addEventListener('keydown',e=>{if(e.key==='c')$('#clear').click();if(e.key==='z')$('#undo').click()});

function buildTeach(){$('#teach').innerHTML='';[...abc].forEach((c,i)=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>teach(i);$('#teach').append(b)})}
async function teach(n){
  const ink=getInk(); if(!ink)return;
  const r=await fetch(`/api/learn?w=${W}&h=${H}&label=${n}`,{method:'POST',body:ink}), j=await r.json();
  if(j.error){say(j.error);return}
  last=[j.digit];text=j.digit.ch;render();
  say(`learned a "${abc[n]}" (${j.learned} correction${j.learned>1?'s':''} so far). Now it says ${j.digit.ch} at ${Math.round(j.digit.conf*100)}%.`);info();
}
$('#save').onclick=async()=>{const j=await (await fetch('/api/save',{method:'POST'})).json();say(j.error||'saved to '+j.saved)};
$('#reset').onclick=async()=>{await fetch('/api/reset',{method:'POST'});say('model reset to its original weights');info();predict()};

$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{
  undo.push(ctx.getImageData(0,0,W,H));blank();const s=Math.min(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
  ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);cleanPhoto();predict()};img.src=URL.createObjectURL(f);e.target.value=''};
function cleanPhoto(){ // photos of paper: find the background grey, flip if the ink is lighter, then stretch contrast
  const im=ctx.getImageData(0,0,W,H),d=im.data,hist=new Array(256).fill(0);
  for(let i=0;i<d.length;i+=4){const g=(d[i]+d[i+1]+d[i+2])/3|0;d[i]=g;hist[g]++}
  let acc=0,bg=0;for(let g=0;g<256;g++){acc+=hist[g];if(acc>=W*H/2){bg=g;break}}
  const flip=bg<128;let dark=0;
  for(let i=0;i<d.length;i+=4){let v=flip?d[i]-bg:bg-d[i];v=Math.max(0,v-18)*255/Math.max(30,(flip?255-bg:bg)-18);dark=Math.min(255,v);
    const g=255-Math.min(255,dark*1.4);d[i]=d[i+1]=d[i+2]=g;d[i+3]=255}
  ctx.putImageData(im,0,0)}

async function info(){try{const j=await (await fetch('/api/info')).json();if(j.alphabet&&j.alphabet!==abc){abc=j.alphabet;buildTeach();nextTarget()}
  $('#info').textContent=`${j.model} · ${j.params.toLocaleString()} weights · ${j.kb} KB`+(j.testAcc>=0?` · ${j.testAcc.toFixed(2)}% on MNIST test`:'')+(j.learned?` · ${j.learned} corrections`:'')}catch(e){$('#info').textContent='server not reachable'}}

function nextTarget(){if(!pool.length)pool=[...abc].sort(()=>Math.random()-.5);tgt=pool.pop();$('#target').textContent=tgt}
function showScore(){$('#score').textContent=tried?`before learning from you, the model was right on ${got} of ${tried}. ${pool.length} left in this round.`:'it learns from each drawing you submit'}
async function submit(){
  const ink=getInk(); if(!ink||!tgt)return;
  const q=`w=${W}&h=${H}`, idx=abc.indexOf(tgt);
  const p=await (await fetch(`/api/predict?${q}&mode=single&tta=0`,{method:'POST',body:ink})).json();
  if(p.digits&&p.digits[0]){tried++;if(p.digits[0].ch===tgt)got++}
  const j=await (await fetch(`/api/learn?${q}&label=${idx}`,{method:'POST',body:ink})).json();
  if(j.error){say(j.error);return}
  blank();undo=[];last=[];text='';render();nextTarget();showScore();info();
}
$('#prac').onclick=()=>{prac=!prac;$('#prac').classList.toggle('on',prac);$('#pracBox').hidden=!prac;if(prac){setMode('single');nextTarget();showScore()}render()};
$('#submit').onclick=submit;$('#skip').onclick=()=>{nextTarget();$('#clear').click()};
addEventListener('keydown',e=>{if(e.key==='Enter'&&prac)submit()});
info();render();
</script></body></html>
